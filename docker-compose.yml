services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reconectar}
      MYSQL_USER: ${MYSQL_USER:-reconectar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reconectar}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-reconectar}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-reconectar}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-reconectar}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.2
    # A imagem "wordpress:cli-php8.2" é Alpine-based (www-data = UID 82),
    # enquanto "wordpress:7-php8.2-apache" (serviço "wordpress") é
    # Debian-based (www-data = UID 33) e é quem cria os arquivos padrão em
    # wp-content/ no volume compartilhado.
    # Sem fixar o UID/GID aqui, o wpcli não consegue escrever nesses arquivos
    # (ex.: uploads/, upgrade/), pois pertencem ao UID 33.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-reconectar}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-reconectar}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-reconectar}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-reconectar-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@reconectar.local}
      WP_TITLE: ${WP_TITLE:-Reconectar - Incubadora Digital}
      WP_URL: ${WP_URL:-http://localhost:8090}
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/var/www/scripts

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-reconectar}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-reconectar}

volumes:
  db-data:
  wordpress-data:
