services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reconectar}
      MYSQL_USER: ${MYSQL_USER:-reconectar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reconectar}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:7-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-reconectar}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-reconectar}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-reconectar}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      # Default "1" para quem desenvolve; o servidor desliga pelo .env. Ligado
      # em produção, um aviso do PHP impresso antes de um wp_redirect() derruba
      # os header() de pluggable.php e a ação simplesmente não acontece — e o
      # provision.sh só alcança WP_DEBUG_DISPLAY, não esta variável.
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.2
    # A imagem "wordpress:cli-php8.2" é Alpine-based (www-data = UID 82),
    # enquanto "wordpress:7-php8.2-apache" (serviço "wordpress") é
    # Debian-based (www-data = UID 33) e é quem cria os arquivos padrão em
    # wp-content/ no volume compartilhado.
    # Sem fixar o UID/GID aqui, o wpcli não consegue escrever nesses arquivos
    # (ex.: uploads/, upgrade/), pois pertencem ao UID 33.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-reconectar}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-reconectar}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-reconectar}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-reconectar-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@reconectar.local}
      WP_TITLE: ${WP_TITLE:-Reconectar - Incubadora Digital}
      WP_URL: ${WP_URL:-http://localhost:8090}
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/var/www/scripts

  # Monta a demonstração inteira (provisionamento + carga de dados) em uma
  # execução. Não é uma imagem própria: é a mesma "wordpress:cli-php8.2" do
  # serviço "wpcli", que já traz tudo de que a carga precisa — WP-CLI, PHP 8.2 e
  # a extensão GD, usada para gerar as imagens dos produtos. Construir uma
  # imagem autoral significaria empacotar um script que já chega pelo
  # bind-mount, ao custo de um rebuild a cada ajuste nele.
  #
  # O profile "demo" mantém o serviço fora do "docker compose up" comum: ele
  # roda até o fim e sai, e um serviço assim no conjunto padrão apareceria como
  # container "Exited (0)" toda vez que o ambiente subisse.
  #
  #   docker compose run --rm demo
  #   ./scripts/demo-completa.sh   (equivalente, subindo os serviços antes)
  demo:
    image: wordpress:cli-php8.2
    profiles: ["demo"]
    # Mesmo motivo do serviço "wpcli": a imagem CLI é Alpine (www-data = 82) e
    # os arquivos do volume pertencem ao UID 33, criado pela imagem Apache.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-reconectar}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-reconectar}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-reconectar}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-reconectar-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@reconectar.local}
      WP_TITLE: ${WP_TITLE:-Reconectar - Incubadora Digital}
      WP_URL: ${WP_URL:-http://localhost:8090}
      PHPMYADMIN_PORT: ${PHPMYADMIN_PORT:-8081}
      RECONECTAR_DEMO_SENHA: ${RECONECTAR_DEMO_SENHA:-reconectar-demo}
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/var/www/scripts
    command: ["bash", "/var/www/scripts/demo-completa.sh"]

  # Proxy HTTPS da produção. Termina o TLS com certificado do Let's Encrypt,
  # emitido e renovado pelo próprio Caddy, e repassa ao `wordpress`. A
  # configuração e o porquê de cada linha estão em `docker/Caddyfile`.
  #
  # Atrás do profile "https" pelo mesmo motivo do `demo`: no desenvolvimento ele
  # disputaria a porta 80 da máquina e tentaria emitir certificado para
  # `localhost`, que o Let's Encrypt recusa. O `implantar.yml` o sobe pelo nome,
  # o que ativa o profile, e só quando o `WP_URL` do servidor começa com
  # `https://`.
  #
  # Com ele no ar, a 80 é dele: o `.env` do servidor tem de mover o
  # `WORDPRESS_PORT` para `127.0.0.1:8090`. A trava do loopback não é só para
  # liberar a porta — o `wp-config.php` declara HTTPS a toda requisição que
  # chegue pelo host público, e uma porta do `wordpress` aberta para fora
  # responderia em HTTP puro dizendo que é HTTPS.
  proxy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    environment:
      WP_URL: ${WP_URL:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # O certificado e a conta ACME. Sem volume, cada recriação do container
      # pediria certificado novo, e o Let's Encrypt limita a cinco emissões
      # idênticas por semana — o sexto deploy da semana derrubaria o HTTPS.
      - caddy-data:/data
      - caddy-config:/config

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-reconectar}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-reconectar}

volumes:
  db-data:
  wordpress-data:
  caddy-data:
  caddy-config:
